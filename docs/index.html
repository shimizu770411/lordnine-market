<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LORDNINE Market Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0c14;
    --bg2: #0f1220;
    --bg3: #141828;
    --border: #1e2440;
    --rare: #4a9eff;
    --rare-dim: rgba(74,158,255,0.15);
    --epic: #c77dff;
    --epic-dim: rgba(199,125,255,0.15);
    --equiv: #00e5a0;
    --equiv-dim: rgba(0,229,160,0.15);
    --avg: #ffd166;
    --text: #e0e6f0;
    --text-dim: #6b7a9e;
    --accent: #4a9eff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 20px;
  }

  /* ヘッダー */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .logo span { color: var(--text-dim); font-weight: 400; }

  .last-update {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* スケールボタン */
  .scale-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .scale-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.15s;
  }

  .scale-btn:hover { border-color: var(--accent); color: var(--text); }
  .scale-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  /* サマリーカード */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .card-label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Rajdhani', sans-serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }

  .card-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .rare-val { color: var(--rare); }
  .epic-val { color: var(--epic); }
  .equiv-val { color: var(--equiv); }

  /* チャートエリア */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 768px) {
    .charts-grid { grid-template-columns: 1fr; }
  }

  .chart-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }

  .chart-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .chart-box canvas { width: 100% !important; }

  /* ローディング */
  .loading {
    text-align: center;
    padding: 60px;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 2px;
  }

  .loading::after {
    content: '';
    display: block;
    width: 40px; height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 16px auto 0;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* 凡例 */
  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .legend-line {
    width: 20px; height: 2px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">LORDNINE <span>MARKET TRACKER</span></div>
  <div class="last-update" id="lastUpdate">読込中...</div>
</header>

<div class="scale-bar">
  <button class="scale-btn" data-hours="0.0833">5M</button>
  <button class="scale-btn" data-hours="0.5">30M</button>
  <button class="scale-btn" data-hours="1">1H</button>
  <button class="scale-btn" data-hours="4">4H</button>
  <button class="scale-btn" data-hours="8">8H</button>
  <button class="scale-btn active" data-hours="24">24H</button>
  <button class="scale-btn" data-hours="72">3D</button>
  <button class="scale-btn" data-hours="168">7D</button>
  <button class="scale-btn" data-hours="720">30D</button>
  <button class="scale-btn" data-hours="2160">90D</button>
  <button class="scale-btn" data-hours="8760">1Y</button>
</div>

<div class="summary-grid">
  <div class="card">
    <div class="card-label">レア 最安値</div>
    <div class="card-value rare-val" id="rareMin">-</div>
    <div class="card-sub" id="rareCount">登録件数: -</div>
  </div>
  <div class="card">
    <div class="card-label">レア 上位5平均</div>
    <div class="card-value rare-val" id="rareAvg">-</div>
    <div class="card-sub">直近取得値</div>
  </div>
  <div class="card">
    <div class="card-label">エピック 最安値</div>
    <div class="card-value epic-val" id="epicMin">-</div>
    <div class="card-sub" id="epicCount">登録件数: -</div>
  </div>
  <div class="card">
    <div class="card-label">エピック レア換算</div>
    <div class="card-value equiv-val" id="epicEquiv">-</div>
    <div class="card-sub">最安値÷5</div>
  </div>
</div>

<div id="mainContent">
  <div class="loading">データ読込中</div>
</div>

<script>
const SUPABASE_URL = 'https://lvtqanjloslkwapvgdpw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dHFhbmpsb3Nsa3dhcHZnZHB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTA1NjgsImV4cCI6MjA5NDE4NjU2OH0.2cCNqCeIugWsvO7Eatdz2t7KCYcENss3z83U_7Udp1Q';

let rareChart = null;
let epicChart = null;
let currentHours = 24;

const chartDefaults = {
  responsive: true,
  maintainAspectRatio: true,
  aspectRatio: 2,
  interaction: { mode: 'index', intersect: false },
  plugins: {
    legend: { display: false },
    tooltip: {
      backgroundColor: '#0f1220',
      borderColor: '#1e2440',
      borderWidth: 1,
      titleColor: '#6b7a9e',
      bodyColor: '#e0e6f0',
      callbacks: {
        label: ctx => `${ctx.dataset.label}: ¥${ctx.parsed.y.toLocaleString()}`
      }
    }
  },
  scales: {
    x: {
      grid: { color: '#1e2440' },
      ticks: { color: '#6b7a9e', font: { size: 11 }, maxTicksLimit: 8 }
    },
    y: {
      grid: { color: '#1e2440' },
      ticks: {
        color: '#6b7a9e',
        font: { size: 11 },
        callback: v => '¥' + v.toLocaleString()
      }
    }
  }
};

function formatTime(iso) {
  const d = new Date(iso);
  const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
  const mm = String(jst.getUTCMonth()+1).padStart(2,'0');
  const dd = String(jst.getUTCDate()).padStart(2,'0');
  const hh = String(jst.getUTCHours()).padStart(2,'0');
  const mi = String(jst.getUTCMinutes()).padStart(2,'0');
  return `${mm}/${dd} ${hh}:${mi}`;
}

async function fetchData(hours) {
  const since = new Date(Date.now() - hours * 3600 * 1000).toISOString();
  const url = `${SUPABASE_URL}/rest/v1/price_snapshots?fetched_at=gte.${since}&order=fetched_at.asc&select=fetched_at,rarity,min_price,top5_avg_price,min_price_rare_equiv,top5_avg_rare_equiv,total_count`;
  const res = await fetch(url, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    }
  });
  return await res.json();
}

function buildCharts(data) {
  const rare = data.filter(d => d.rarity === 'レア');
  const epic = data.filter(d => d.rarity === 'エピック');

  // サマリー更新
  if (rare.length > 0) {
    const latest = rare[rare.length - 1];
    document.getElementById('rareMin').textContent = '¥' + latest.min_price?.toLocaleString();
    document.getElementById('rareAvg').textContent = '¥' + latest.top5_avg_price?.toLocaleString();
    document.getElementById('rareCount').textContent = '登録件数: ' + latest.total_count?.toLocaleString();
  }
  if (epic.length > 0) {
    const latest = epic[epic.length - 1];
    document.getElementById('epicMin').textContent = '¥' + latest.min_price?.toLocaleString();
    document.getElementById('epicEquiv').textContent = '¥' + latest.min_price_rare_equiv?.toLocaleString();
    document.getElementById('epicCount').textContent = '登録件数: ' + latest.total_count?.toLocaleString();

    // 最終更新
    const jst = new Date(new Date(latest.fetched_at).getTime() + 9*3600*1000);
    document.getElementById('lastUpdate').textContent = '最終更新: ' + formatTime(latest.fetched_at) + ' JST';
  }

  // チャートHTML
  document.getElementById('mainContent').innerHTML = `
    <div class="charts-grid">
      <div class="chart-box">
        <div class="chart-title"><span class="dot" style="background:var(--rare)"></span>レア 価格推移</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-line" style="background:var(--rare)"></div>最安値</div>
          <div class="legend-item"><div class="legend-line" style="background:var(--avg)"></div>上位5平均</div>
          <div class="legend-item"><div class="legend-line" style="background:var(--equiv)"></div>エピック換算</div>
          <div class="legend-item"><div class="legend-line" style="background: repeating-linear-gradient(to right, var(--equiv) 0, var(--equiv) 4px, transparent 4px, transparent 8px);"></div>換算上位5平均</div>
        </div>
        <canvas id="rareCanvas"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title"><span class="dot" style="background:var(--epic)"></span>エピック 価格推移</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-line" style="background:var(--epic)"></div>最安値</div>
          <div class="legend-item"><div class="legend-line" style="background:var(--avg)"></div>上位5平均</div>
        </div>
        <canvas id="epicCanvas"></canvas>
      </div>
    </div>
  `;

  const rareLabels = rare.map(d => formatTime(d.fetched_at));
  const epicLabels = epic.map(d => formatTime(d.fetched_at));

  // レアチャート
  if (rareChart) rareChart.destroy();
  rareChart = new Chart(document.getElementById('rareCanvas'), {
    type: 'line',
    data: {
      labels: rareLabels,
      datasets: [
        {
          label: '最安値',
          data: rare.map(d => d.min_price),
          borderColor: '#4a9eff',
          backgroundColor: 'rgba(74,158,255,0.05)',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          fill: true,
        },
        {
          label: '上位5平均',
          data: rare.map(d => d.top5_avg_price),
          borderColor: '#ffd166',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.3,
        },
        {
          label: 'エピック換算最安値',
          data: epic.map(d => d.min_price_rare_equiv),
          borderColor: '#00e5a0',
          backgroundColor: 'rgba(0,229,160,0.05)',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          fill: true,
        },
        {
          label: 'エピック換算上位5平均',
          data: epic.map(d => d.top5_avg_rare_equiv),
          borderColor: '#00e5a0',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          borderDash: [4, 4],
          pointRadius: 0,
          tension: 0.3,
        },
      ]
    },
    options: { ...chartDefaults, plugins: { ...chartDefaults.plugins, tooltip: { ...chartDefaults.plugins.tooltip, callbacks: { label: ctx => `${ctx.dataset.label}: ¥${ctx.parsed.y?.toLocaleString()}` } } } }
  });

  // エピックチャート
  if (epicChart) epicChart.destroy();
  epicChart = new Chart(document.getElementById('epicCanvas'), {
    type: 'line',
    data: {
      labels: epicLabels,
      datasets: [
        {
          label: '最安値',
          data: epic.map(d => d.min_price),
          borderColor: '#c77dff',
          backgroundColor: 'rgba(199,125,255,0.05)',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          fill: true,
        },
        {
          label: '上位5平均',
          data: epic.map(d => d.top5_avg_price),
          borderColor: '#ffd166',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.3,
        },
      ]
    },
    options: chartDefaults
  });
}

async function load(hours) {
  document.getElementById('mainContent').innerHTML = '<div class="loading">データ読込中</div>';
  try {
    const data = await fetchData(hours);
    if (data.length === 0) {
      document.getElementById('mainContent').innerHTML = '<div class="loading">データがありません</div>';
      return;
    }
    buildCharts(data);
  } catch(e) {
    document.getElementById('mainContent').innerHTML = '<div class="loading">読込エラー</div>';
    console.error(e);
  }
}

// スケールボタン
document.querySelectorAll('.scale-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentHours = parseFloat(btn.dataset.hours);
    load(currentHours);
  });
});

// 初回ロード & 5分ごと自動更新
load(currentHours);
setInterval(() => load(currentHours), 5 * 60 * 1000);
</script>
</body>
</html>
